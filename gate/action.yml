name: design gate
description: Fails a pull request when its UI changes add WCAG A failures, and posts the list with fixes as one PR comment.
branding:
  icon: check-square
  color: green
inputs:
  base:
    description: Ref to compare against. Defaults to the pull request base.
    default: ''
  serve:
    description: Optional command that starts the site in the background for the rendered axe-core check (e.g. "npm run preview &"). Needs "urls" in .design-gate.json.
    default: ''
  wait-for:
    description: URL to wait for after "serve" before checking (up to 60 s).
    default: ''
  comment:
    description: Post or update the PR comment ("true"/"false").
    default: 'true'
outputs:
  state:
    description: PASS, FAIL, SKIPPED, OVERRIDDEN or UNJUDGED
    value: ${{ steps.gate.outputs.state }}
runs:
  using: composite
  steps:
    - name: Install the rendered-check tools
      if: hashFiles('.design-gate.json') != ''
      shell: bash
      run: |
        if grep -q '"urls"' .design-gate.json; then
          # An install failure must not fail the job: the static check still runs and the rendered one says UNJUDGED.
          if { mkdir -p "$RUNNER_TEMP/design-gate-deps" && cd "$RUNNER_TEMP/design-gate-deps" &&
               npm init -y >/dev/null && npm i --no-audit --no-fund playwright-core@1.63.0 axe-core@4.13.0 >/dev/null &&
               npx playwright-core install --with-deps chromium >/dev/null; }; then
            echo "DESIGN_GATE_DEPS=$RUNNER_TEMP/design-gate-deps" >> "$GITHUB_ENV"
          else
            echo "::warning::design gate could not install playwright-core and axe-core, so the rendered check will not run this time."
          fi
        fi
    - name: Start the site
      if: inputs.serve != ''
      shell: bash
      env:
        SERVE: ${{ inputs.serve }}
        WAIT_FOR: ${{ inputs.wait-for }}
      run: |
        bash -c "$SERVE"
        if [ -n "$WAIT_FOR" ]; then
          up=
          for i in $(seq 60); do curl -fs -o /dev/null "$WAIT_FOR" && up=1 && break; sleep 1; done
          [ -n "$up" ] || echo "::warning::design gate: $WAIT_FOR did not answer within 60 s; the rendered check will say UNJUDGED."
        fi
    - name: Run the gate
      id: gate
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
      run: |
        set +e
        node "$GITHUB_ACTION_PATH/../plugins/design-gate/scripts/run.mjs" ci --base "${BASE:-origin/HEAD}" --report "$RUNNER_TEMP/design-gate.md"
        code=$?
        if [ ! -s "$RUNNER_TEMP/design-gate.md" ]; then
          # The engine never got as far as a report (Node missing or too old, a broken checkout): the gate's own
          # trouble, so it says UNJUDGED and stays green.
          echo "::warning::design gate could not run (node exit $code), so nothing was checked."
          printf '<!-- design-gate -->\n**design gate: UNJUDGED**\n\nThe gate could not start (node exit %s), so nothing was checked. The check stays green; see the job log.\n' "$code" > "$RUNNER_TEMP/design-gate.md"
          code=0
        fi
        state=$(grep -oE 'design gate [0-9.]+: [A-Z]+' "$RUNNER_TEMP/design-gate.md" 2>/dev/null | awk '{print $NF}')
        echo "state=${state:-UNJUDGED}" >> "$GITHUB_OUTPUT"
        # Only a FAIL verdict fails the check; any other exit is the gate's own trouble.
        [ "$state" = FAIL ] || code=0
        [ -f "$RUNNER_TEMP/design-gate.md" ] && cat "$RUNNER_TEMP/design-gate.md" >> "$GITHUB_STEP_SUMMARY"
        echo "$code" > "$RUNNER_TEMP/design-gate.code"
    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        STATE: ${{ steps.gate.outputs.state }}
      run: |
        [ -f "$RUNNER_TEMP/design-gate.md" ] || exit 0
        id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- design-gate -->")) | .id' | head -n1)
        # No UI change: stay silent, but replace an older verdict so a stale FAIL never stands.
        [ "$STATE" = SKIPPED ] && [ -z "$id" ] && exit 0
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/design-gate.md" >/dev/null || echo "::warning::design gate could not update its PR comment (needs permissions: pull-requests: write)"
        else
          gh api "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/design-gate.md" >/dev/null || echo "::warning::design gate could not post its PR comment (needs permissions: pull-requests: write)"
        fi
    - name: Result
      shell: bash
      run: exit "$(cat "$RUNNER_TEMP/design-gate.code" 2>/dev/null || echo 0)"
